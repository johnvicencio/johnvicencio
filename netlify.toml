[build]
  command = "node .agent-code/scripts/generate-image-index.mjs && dotnet publish -c Release"
  publish = "bin/Release/net8.0/publish/wwwroot"
  functions = "netlify/functions"

[dev]
  framework = "#static"
  command = "dotnet watch publish -c Release"
  publish = "bin/Release/net8.0/publish/wwwroot"
  port = 8888

[[redirects]]
  from = "/_framework/*"
  to = "/_framework/:splat"
  status = 200

[[redirects]]
  from = "/_content/*"
  to = "/_content/:splat"
  status = 200

[[redirects]]
  from = "/css/*"
  to = "/css/:splat"
  status = 200

[[redirects]]
  from = "/js/*"
  to = "/js/:splat"
  status = 200

[[redirects]]
  from = "/images/*"
  to = "/images/:splat"
  status = 200

[[redirects]]
  from = "/manifest.webmanifest"
  to = "/manifest.webmanifest"
  status = 200

[[redirects]]
  from = "/icon-*.png"
  to = "/icon-:splat.png"
  status = 200

[[redirects]]
  from = "/experience"
  to = "/#experience"
  status = 301

[[redirects]]
  from = "/portfolio"
  to = "/#portfolio"
  status = 301

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
