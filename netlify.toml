[build]
  # Strip AppleDouble (._*) from pCloud/JV4TB before CSC; exclude vault seed via csproj.
  command = "bash -lc 'find . -name \"._*\" -delete; export COPYFILE_DISABLE=1; dotnet publish johnvicencio.csproj -c Release'"
  publish = "bin/Release/net8.0/publish/wwwroot"
  functions = "netlify/functions"

[dev]
  framework = "#static"
  command = "dotnet watch publish -c Release"
  publish = "bin/Release/net8.0/publish/wwwroot"
  port = 8889
  staticServerPort = 4001
  functionsPort = 9999

[[headers]]
  for = "/css/app.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/css/pico.min.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# GUIDE §8.2a / FEAT-WEB-NETLIFY-SECURITY-DEFAULTS — match mythoslife.com baseline (JV-tuned CSP).
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self' https://johnvicencio.com; img-src 'self' data: https:; font-src 'self' data:; style-src 'self' 'unsafe-inline' https://johnvicencio.com; script-src 'self' 'wasm-unsafe-eval' 'unsafe-inline' https://johnvicencio.com https://*.netlify.app https://api.netlify.com; connect-src 'self' https://johnvicencio.com https://*.netlify.app https://api.netlify.com; worker-src 'self' blob:; child-src 'self' blob:; frame-src 'none'"

[[headers]]
  for = "/"
  [headers.values]
    Link = "<https://johnvicencio.com>; rel=canonical"

# Never serve vault seed crypto from the static CDN (offline crack material).
# Keep wwwroot/data/users for local function fallback only; exclude from publish + deny here.
[[redirects]]
  from = "/data/users/*"
  to = "/__denied__"
  status = 404
  force = true

[[redirects]]
  from = "/_framework/*"
  to = "/_framework/:splat"
  status = 200

[[redirects]]
  from = "/_content/*"
  to = "/_content/:splat"
  status = 200

[[redirects]]
  from = "/css/*"
  to = "/css/:splat"
  status = 200

[[redirects]]
  from = "/js/*"
  to = "/js/:splat"
  status = 200

[[redirects]]
  from = "/images/*"
  to = "/images/:splat"
  status = 200

[[redirects]]
  from = "/manifest.webmanifest"
  to = "/manifest.webmanifest"
  status = 200

[[redirects]]
  from = "/icon-*.png"
  to = "/icon-:splat.png"
  status = 200

[[redirects]]
  from = "/experience"
  to = "/#experience"
  status = 301

[[redirects]]
  from = "/portfolio"
  to = "/#portfolio"
  status = 301

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
