[build]
  command = "dotnet publish -c Release"
  publish = "bin/Release/net8.0/publish/wwwroot"
  functions = "netlify/functions"

[dev]
  framework = "#static"
  command = "dotnet watch publish -c Release"
  publish = "bin/Release/net8.0/publish/wwwroot"
  port = 8889
  staticServerPort = 4001
  functionsPort = 9999

[[headers]]
  for = "/css/app.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/css/pico.min.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/"
  [headers.values]
    Link = "<https://johnvicencio.com>; rel=canonical"

[[redirects]]
  from = "/_framework/*"
  to = "/_framework/:splat"
  status = 200

[[redirects]]
  from = "/_content/*"
  to = "/_content/:splat"
  status = 200

[[redirects]]
  from = "/css/*"
  to = "/css/:splat"
  status = 200

[[redirects]]
  from = "/js/*"
  to = "/js/:splat"
  status = 200

[[redirects]]
  from = "/images/*"
  to = "/images/:splat"
  status = 200

[[redirects]]
  from = "/manifest.webmanifest"
  to = "/manifest.webmanifest"
  status = 200

[[redirects]]
  from = "/icon-*.png"
  to = "/icon-:splat.png"
  status = 200

[[redirects]]
  from = "/experience"
  to = "/#experience"
  status = 301

[[redirects]]
  from = "/portfolio"
  to = "/#portfolio"
  status = 301

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
